services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_PASSWORD: Wach1@3079
      POSTGRES_USER: wachi
      POSTGRES_DB: wachi
    volumes:
      - ./data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: wachi@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: Wach1@3079
    ports:
      - "8081:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin