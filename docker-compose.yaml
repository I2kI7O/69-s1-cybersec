services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "${POSTGRES_PORT:-54327}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wachi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-wachi}
    volumes:
      - ./data/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wachi} -d ${POSTGRES_DB:-wachi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "${PGADMIN_DEFAULT_PORT:-8081}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-wachi@rmutp.ac.th}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Wach1@3079}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "${APP_PORT:-9091}:1337"
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-wachi}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${POSTGRES_USER:-wachi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-myJwtSecretKey12345}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-myAdminJwtSecretKey12345}
      APP_KEYS: ${APP_KEYS:-key1,key2,key3,key4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-myApiTokenSalt12345}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-myTransferTokenSalt12345}
    volumes:
      - ./config/plugins.js:/opt/app/config/plugins.js
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin_data: